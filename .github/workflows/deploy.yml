name: Deploy

on:
  push:
    tags:
      - "v*"

jobs:
  verify_and_deploy:
    name: Verify and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      - name: Set up Forge CLI
        run: npm install -g @forge/cli

      - name: Deploy to development
        env:
          FORGE_TOKEN: ${{ secrets.FORGE_TOKEN }}
        run: forge deploy --non-interactive --environment development

      - name: Post-deployment note
        run: |
          echo "✅ Deployment to development complete!"
          echo "Next step: run 'forge install --upgrade --site <site-url> --product jira --environment development'"
